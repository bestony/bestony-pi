name: Release

on:
  schedule:
    # 16:00 UTC = 00:00 Asia/Shanghai (China has no DST)
    - cron: "0 16 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Bump patch and publish when direct dependencies are unchanged"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: daily-release
  cancel-in-progress: false

jobs:
  update-and-publish:
    # Avoid loop: bot release commits re-triggering push workflow
    if: >
      github.event_name != 'push' ||
      (github.actor != 'github-actions[bot]' &&
       !startsWith(github.event.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"

      - name: Ensure modern npm (Trusted Publisher requires >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install current dependencies
        run: npm ci

      - name: Detect direct dependency updates
        id: dependency-updates
        # Only scheduled and manual runs update dependencies — never main pushes.
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          UPDATES_FILE="$(mktemp)"
          trap 'rm -f "$UPDATES_FILE"' EXIT

          npx npm-check-updates --jsonUpgraded > "$UPDATES_FILE"

          node - "$UPDATES_FILE" <<'NODE'
          const fs = require("node:fs");

          const updatesFile = process.argv[2];
          const raw = fs.readFileSync(updatesFile, "utf8").trim();
          let upgrades;

          try {
            upgrades = JSON.parse(raw);
          } catch (error) {
            throw new Error(
              `npm-check-updates did not return valid JSON: ${error.message}`,
            );
          }

          if (
            upgrades === null ||
            Array.isArray(upgrades) ||
            typeof upgrades !== "object"
          ) {
            throw new Error("npm-check-updates output must be a JSON object.");
          }

          const updateCount = Object.keys(upgrades).length;
          const hasDirectDependencyUpdates = updateCount > 0;

          fs.appendFileSync(
            process.env.GITHUB_OUTPUT,
            `has_direct_dependency_updates=${hasDirectDependencyUpdates}\n`,
          );
          console.log(`Direct dependency updates detected: ${updateCount}.`);
          NODE

      - name: Apply direct dependency updates
        if: steps.dependency-updates.outputs.has_direct_dependency_updates == 'true'
        run: |
          set -euo pipefail
          npx npm-check-updates -u
          npm install

      - name: Verify dependency update changed package files
        if: steps.dependency-updates.outputs.has_direct_dependency_updates == 'true'
        run: |
          set -euo pipefail
          if git diff --quiet -- package.json package-lock.json; then
            echo "npm-check-updates detected direct dependency updates, but package.json and package-lock.json did not change after applying them." >&2
            exit 1
          fi

      - name: Decide whether to release
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_PUBLISH: ${{ inputs.force_publish }}
          HAS_DIRECT_DEPENDENCY_UPDATES: ${{ steps.dependency-updates.outputs.has_direct_dependency_updates || 'false' }}
        run: |
          set -euo pipefail
          SHOULD_RELEASE=false

          if [ "$EVENT_NAME" = "push" ]; then
            SHOULD_RELEASE=true
            echo "Push to main: always attempt publish."
          elif [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "${FORCE_PUBLISH:-false}" = "true" ]; then
            SHOULD_RELEASE=true
            echo "Force publish requested."
          elif [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if [ "${HAS_DIRECT_DEPENDENCY_UPDATES:-false}" = "true" ]; then
              SHOULD_RELEASE=true
              echo "Direct dependency updates detected; release will proceed."
            else
              echo "No direct dependency updates; skip release."
            fi
          fi

          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Configure git
        if: steps.decide.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ensure unpublished version, commit, and tag
        if: steps.decide.outputs.should_release == 'true'
        id: version
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          CURRENT="$(node -p "require('./package.json').version")"
          CREATED_COMMIT=false
          CREATED_TAG=false

          if npm view "${PACKAGE_NAME}@${CURRENT}" version >/dev/null 2>&1; then
            echo "Version ${CURRENT} already on npm; bumping patch."
            npm version patch --no-git-tag-version
          else
            echo "Version ${CURRENT} is not on npm; will publish as-is."
          fi

          VERSION="$(node -p "require('./package.json').version")"

          # Commit dependency bumps and/or version bump if working tree dirty
          if ! git diff --quiet -- package.json package-lock.json; then
            git add package.json package-lock.json
            git commit -m "chore(release): ${VERSION}"
            CREATED_COMMIT=true
            echo "Created release commit for ${VERSION}."
          else
            echo "No file changes to commit (version already set in tree)."
          fi

          RELEASE_COMMIT="$(git rev-parse HEAD)"
          TAG="v${VERSION}"

          # Resolve the comparison point before creating the current tag. A
          # reachable version tag is preferred; older repositories without
          # tags fall back to the previous release commit.
          BASE_REF=""
          if BASE_REF="$(git describe --tags --match 'v[0-9]*' --abbrev=0 "${RELEASE_COMMIT}^" 2>/dev/null)"; then
            echo "Using previous version tag ${BASE_REF} as the release base."
          else
            BASE_REF="$(git log --format='%H' --grep='^chore(release):' -n 1 "${RELEASE_COMMIT}^" 2>/dev/null || true)"
            if [ -n "$BASE_REF" ]; then
              echo "No previous version tag found; using release commit ${BASE_REF} as the base."
            else
              echo "No previous version tag or release commit found; notes will cover repository history."
            fi
          fi

          if git show-ref --verify --quiet "refs/tags/${TAG}"; then
            EXISTING_TAG_COMMIT="$(git rev-parse "${TAG}^{commit}")"
            if [ "$EXISTING_TAG_COMMIT" != "$RELEASE_COMMIT" ]; then
              echo "Tag ${TAG} already points to ${EXISTING_TAG_COMMIT}, expected ${RELEASE_COMMIT}." >&2
              exit 1
            fi
            echo "Tag ${TAG} already exists on the release commit."
          else
            git tag --annotate "$TAG" --message "Release ${TAG}" "$RELEASE_COMMIT"
            CREATED_TAG=true
            echo "Created annotated tag ${TAG}."
          fi

          {
            echo "VERSION=${VERSION}"
            echo "TAG=${TAG}"
            echo "RELEASE_COMMIT=${RELEASE_COMMIT}"
            echo "BASE_REF=${BASE_REF}"
          } >> "$GITHUB_ENV"
          {
            echo "version=${VERSION}"
            echo "tag=${TAG}"
            echo "base_ref=${BASE_REF}"
            echo "release_commit=${RELEASE_COMMIT}"
            echo "created_commit=${CREATED_COMMIT}"
            echo "created_tag=${CREATED_TAG}"
          } >> "$GITHUB_OUTPUT"

      - name: Publish to npm (OIDC Trusted Publisher)
        if: steps.decide.outputs.should_release == 'true'
        run: npm publish --access public

      - name: Push commit and/or tags
        if: steps.decide.outputs.should_release == 'true'
        env:
          CREATED_COMMIT: ${{ steps.version.outputs.created_commit }}
          CREATED_TAG: ${{ steps.version.outputs.created_tag }}
          TAG: ${{ steps.version.outputs.tag }}
        run: |
          set -euo pipefail
          BRANCH="${GITHUB_REF_NAME:-main}"
          if [ "$CREATED_COMMIT" = "true" ] && [ "$CREATED_TAG" = "true" ]; then
            echo "Pushing release commit and ${TAG} atomically."
            git push --atomic origin "HEAD:${BRANCH}" "refs/tags/${TAG}"
          elif [ "$CREATED_COMMIT" = "true" ]; then
            echo "Pushing release commit to ${BRANCH}."
            git push origin "HEAD:${BRANCH}"
          elif [ "$CREATED_TAG" = "true" ]; then
            echo "Pushing ${TAG}."
            git push origin "refs/tags/${TAG}"
          else
            echo "Nothing new to push (commit/tag already on remote)."
          fi

      - name: Generate release notes
        if: steps.decide.outputs.should_release == 'true'
        id: release-notes
        env:
          BASE_REF: ${{ steps.version.outputs.base_ref }}
          RELEASE_COMMIT: ${{ steps.version.outputs.release_commit }}
          TAG: ${{ steps.version.outputs.tag }}
          GITHUB_REPOSITORY: ${{ github.repository }}
        run: |
          set -euo pipefail
          NOTES_FILE="${RUNNER_TEMP}/release-notes-${TAG}.md"
          node .github/scripts/generate-release-notes.mjs \
            --base-ref "$BASE_REF" \
            --head-ref "$RELEASE_COMMIT" \
            --tag "$TAG" \
            --repository "$GITHUB_REPOSITORY" \
            --output "$NOTES_FILE"
          echo "notes_file=${NOTES_FILE}" >> "$GITHUB_OUTPUT"
          echo "Generated release notes at ${NOTES_FILE}."

      - name: Create GitHub Release
        if: steps.decide.outputs.should_release == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          GITHUB_REPOSITORY: ${{ github.repository }}
          TAG: ${{ steps.version.outputs.tag }}
          NOTES_FILE: ${{ steps.release-notes.outputs.notes_file }}
        run: |
          set -euo pipefail
          if gh release view "$TAG" --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "GitHub Release ${TAG} already exists; skipping duplicate creation."
          else
            echo "Creating GitHub Release ${TAG}."
            gh release create "$TAG" \
              --repo "$GITHUB_REPOSITORY" \
              --verify-tag \
              --title "$TAG" \
              --notes-file "$NOTES_FILE"
          fi
