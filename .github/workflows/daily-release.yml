name: Release

on:
  schedule:
    # 16:00 UTC = 00:00 Asia/Shanghai (China has no DST)
    - cron: "0 16 * * *"
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_publish:
        description: "Bump patch and publish even if dependencies are unchanged (schedule/manual only)"
        required: false
        default: false
        type: boolean

permissions:
  contents: write
  id-token: write

concurrency:
  group: daily-release
  cancel-in-progress: false

jobs:
  update-and-publish:
    # Avoid loop: bot release commits re-triggering push workflow
    if: >
      github.event_name != 'push' ||
      (github.actor != 'github-actions[bot]' &&
       !startsWith(github.event.head_commit.message, 'chore(release):'))
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          registry-url: "https://registry.npmjs.org"
          package-manager-cache: false

      - name: Ensure modern npm (Trusted Publisher requires >= 11.5.1)
        run: npm install -g npm@latest

      - name: Install current dependencies
        run: npm ci

      - name: Update dependencies to latest
        # Only for daily schedule / manual dispatch — not on every push
        if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          npx npm-check-updates -u
          npm install

      - name: Decide whether to release
        id: decide
        env:
          EVENT_NAME: ${{ github.event_name }}
          FORCE_PUBLISH: ${{ inputs.force_publish }}
        run: |
          set -euo pipefail
          SHOULD_RELEASE=false

          if [ "$EVENT_NAME" = "push" ]; then
            SHOULD_RELEASE=true
            echo "Push to main: always attempt publish."
          elif [ "${FORCE_PUBLISH:-false}" = "true" ]; then
            SHOULD_RELEASE=true
            echo "Force publish requested."
          elif [ "$EVENT_NAME" = "schedule" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            if git diff --quiet -- package.json package-lock.json; then
              echo "No dependency updates; skip release."
            else
              SHOULD_RELEASE=true
              echo "Dependency files changed."
              git diff --stat -- package.json package-lock.json
            fi
          fi

          echo "should_release=${SHOULD_RELEASE}" >> "$GITHUB_OUTPUT"

      - name: Configure git
        if: steps.decide.outputs.should_release == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

      - name: Ensure unpublished version, commit, and tag
        if: steps.decide.outputs.should_release == 'true'
        id: version
        run: |
          set -euo pipefail
          PACKAGE_NAME="$(node -p "require('./package.json').name")"
          CURRENT="$(node -p "require('./package.json').version")"
          CREATED_COMMIT=false
          CREATED_TAG=false

          if npm view "${PACKAGE_NAME}@${CURRENT}" version >/dev/null 2>&1; then
            echo "Version ${CURRENT} already on npm; bumping patch."
            npm version patch --no-git-tag-version
          else
            echo "Version ${CURRENT} is not on npm; will publish as-is."
          fi

          VERSION="$(node -p "require('./package.json').version")"

          # Commit dependency bumps and/or version bump if working tree dirty
          if ! git diff --quiet -- package.json package-lock.json; then
            git add package.json package-lock.json
            git commit -m "chore(release): ${VERSION}"
            CREATED_COMMIT=true
            echo "Created release commit for ${VERSION}."
          else
            echo "No file changes to commit (version already set in tree)."
          fi

          if git rev-parse "v${VERSION}" >/dev/null 2>&1; then
            echo "Tag v${VERSION} already exists."
          else
            git tag "v${VERSION}"
            CREATED_TAG=true
            echo "Created tag v${VERSION}."
          fi

          echo "VERSION=${VERSION}" >> "$GITHUB_ENV"
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "created_commit=${CREATED_COMMIT}" >> "$GITHUB_OUTPUT"
          echo "created_tag=${CREATED_TAG}" >> "$GITHUB_OUTPUT"

      - name: Publish to npm (OIDC Trusted Publisher)
        if: steps.decide.outputs.should_release == 'true'
        run: npm publish --access public

      - name: Push commit and/or tags
        if: steps.decide.outputs.should_release == 'true'
        env:
          CREATED_COMMIT: ${{ steps.version.outputs.created_commit }}
          CREATED_TAG: ${{ steps.version.outputs.created_tag }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          BRANCH="${{ github.ref_name }}"
          if [ "$CREATED_COMMIT" = "true" ]; then
            git push origin "HEAD:${BRANCH}" --follow-tags
          elif [ "$CREATED_TAG" = "true" ]; then
            git push origin "v${VERSION}"
          else
            echo "Nothing new to push (commit/tag already on remote)."
          fi
